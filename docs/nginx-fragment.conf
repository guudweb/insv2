# Fragmento para el bloque server HTTPS ya configurado por el administrador.
# No contiene certificados ni sustituye la configuración TLS del dominio.
client_max_body_size 16k;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
location / {
    proxy_pass http://127.0.0.1:4321;
}
# Mantener Node enlazado a 127.0.0.1 antes de activar TRUST_PROXY_IP=true.
